                    </div>
                    <p className="text-[11px] text-slate-500 leading-relaxed">
                      다운로드 폴더나 클라우드 드라이브에 보관한 백업 파일을 불러오면 전체 연도 일정과 업무 분류 설정이 즉시 복원됩니다.
                    </p>
                    <button
                      type="button"
                      onClick={() => fileInputRef.current?.click()}
                      className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-extrabold shadow-xs"
                    >
                      백업 파일 찾아서 열기
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ==================== 모달 5: 백업 복구 완료 안내 ==================== */}
      {restoreCompleteModal && (
        <div
          onClick={() => setRestoreCompleteModal(null)}
          className="fixed inset-0 z-50 bg-slate-900/55 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white rounded-t-2xl sm:rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md overflow-hidden"
          >
            <div className="px-5 py-4 border-b bg-indigo-600 text-white border-indigo-700 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
                  <Icon name="checkCircle" className="w-5 h-5" />
                </div>
                <div>
                  <h3 className="text-sm sm:text-base font-extrabold">백업 데이터 복원 완료</h3>
                  <p className="text-[11px] text-white/85">복원 시각: {restoreCompleteModal.timestamp}</p>
                </div>
              </div>
              <button
                onClick={() => setRestoreCompleteModal(null)}
                className="p-1.5 rounded-lg hover:bg-white/15 text-white"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-5 space-y-3.5 text-xs">
              <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                <div className="text-[11px] font-bold text-slate-500">불러온 원본 출처</div>
                <div className="text-xs sm:text-sm font-extrabold text-slate-900 break-all">
                  📥 {restoreCompleteModal.sourceLabel}
                </div>
              </div>

              <div className="p-3 rounded-xl bg-indigo-50/70 border border-indigo-200 space-y-1">
                <div className="flex items-center gap-1.5 font-extrabold text-slate-900">
                  <Icon name="folder" className="w-4 h-4 shrink-0 text-indigo-600" />
                  <span>데이터 복원·저장 위치</span>
                </div>
                <div className="text-xs sm:text-sm font-extrabold text-indigo-800">
                  {restoreCompleteModal.locationTitle}
                </div>
                <p className="text-[11px] text-slate-600 leading-relaxed">{restoreCompleteModal.locationDetail}</p>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div className="p-2 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                  <span className="text-slate-600 font-semibold">복원된 일정</span>
                  <span className="font-extrabold text-slate-900">{restoreCompleteModal.stats.tasksCount}건</span>
                </div>
                <div className="p-2 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                  <span className="text-slate-600 font-semibold">연차·반차 기록</span>
                  <span className="font-extrabold text-teal-700">{restoreCompleteModal.stats.leavesCount || 0}건</span>
                </div>
                <div className="p-2 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                  <span className="text-slate-600 font-semibold">복원된 분류</span>
                  <span className="font-extrabold text-slate-900">{restoreCompleteModal.stats.categoriesCount}개</span>
                </div>
                <div className="p-2 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between">
                  <span className="text-slate-600 font-semibold">복원된 템플릿</span>
                  <span className="font-extrabold text-slate-900">{restoreCompleteModal.stats.templatesCount}개</span>
                </div>
              </div>

              <button
                type="button"
                onClick={() => setRestoreCompleteModal(null)}
                className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold shadow-xs"
              >
                확인했습니다
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ==================== 모달 6: 연차 · 반차 사용 현황 ==================== */}
      {isLeaveSummaryModalOpen && (
        <div
          onClick={() => setIsLeaveSummaryModalOpen(false)}
          className="fixed inset-0 z-50 bg-slate-900/55 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4"
        >
          <div
            onClick={(e) => e.stopPropagation()}
            className="bg-white rounded-t-2xl sm:rounded-2xl border border-slate-200 shadow-2xl w-full max-w-lg overflow-hidden flex flex-col max-h-[92vh] sm:max-h-[88vh]"
          >
            <div className="px-5 py-4 border-b bg-teal-600 text-white border-teal-700 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center text-lg shrink-0">
                  🌴
                </div>
                <div>
                  <h3 className="text-sm sm:text-base font-extrabold">
                    {leaveStats.year}년 연차 · 반차 자동 집계 현황
                  </h3>
                  <p className="text-[11px] text-white/85">
                    연차(1일) · 오전반차(0.5일) · 오후반차(0.5일) 자동 합산
                  </p>
                </div>
              </div>
              <button
                onClick={() => setIsLeaveSummaryModalOpen(false)}
                className="p-1.5 rounded-lg hover:bg-white/15 text-white"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-4 sm:p-5 space-y-4 overflow-y-auto flex-1 text-xs">
              <div className="grid grid-cols-3 gap-2">
                <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                  <div className="text-[11px] font-bold text-slate-500">{activeYear}년 총 연차</div>
                  <div className="flex items-center gap-1">
                    <input
                      type="number"
                      step="0.5"
                      min="0"
                      max="60"
                      value={totalAnnualLeave}
                      onChange={(e) => {
                        const val = Math.max(0, Number(e.target.value));
                        commitCalendarChange((prev) => ({
                          ...prev,
                          annualLeaveByYear: {
                            ...(prev.annualLeaveByYear || {}),
                            [activeYear]: val
                          }
                        }));
                      }}
                      className="w-14 px-1.5 py-0.5 text-sm font-extrabold text-slate-900 border border-slate-300 rounded-md bg-white focus:outline-none focus:border-teal-500"
                    />
                    <span className="font-bold text-slate-700">일</span>
                  </div>
                </div>

                <div className="p-3 rounded-xl bg-teal-50 border border-teal-200 space-y-1">
                  <div className="text-[11px] font-bold text-teal-700">총 사용 일수</div>
                  <div className="text-lg font-extrabold text-teal-900">{leaveStats.usedDays}일</div>
                </div>

                <div className="p-3 rounded-xl bg-indigo-50 border border-indigo-200 space-y-1">
                  <div className="text-[11px] font-bold text-indigo-700">잔여 연차</div>
                  <div
                    className={`text-lg font-extrabold ${
                      leaveStats.remainingDays < 0 ? 'text-rose-600' : 'text-indigo-900'
                    }`}
                  >
                    {leaveStats.remainingDays}일
                  </div>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-2">
                <div className="p-2.5 rounded-xl bg-teal-50/60 border border-teal-200 text-center">
                  <div className="text-[11px] font-bold text-teal-800">🌴 연차 (1일)</div>
                  <div className="text-sm font-extrabold text-teal-950 mt-0.5">
                    {leaveStats.fullCount}회 ({leaveStats.fullCount * 1}일)
                  </div>
                </div>
                <div className="p-2.5 rounded-xl bg-sky-50/60 border border-sky-200 text-center">
                  <div className="text-[11px] font-bold text-sky-800">🌤️ 오전반차 (0.5일)</div>
                  <div className="text-sm font-extrabold text-sky-950 mt-0.5">
                    {leaveStats.amCount}회 ({leaveStats.amCount * 0.5}일)
                  </div>
                </div>
                <div className="p-2.5 rounded-xl bg-orange-50/60 border border-orange-200 text-center">
                  <div className="text-[11px] font-bold text-orange-800">🌇 오후반차 (0.5일)</div>
                  <div className="text-sm font-extrabold text-orange-950 mt-0.5">
                    {leaveStats.pmCount}회 ({leaveStats.pmCount * 0.5}일)
                  </div>
                </div>
              </div>

              <div className="space-y-2">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-extrabold text-slate-800">
                    {activeYear}년 등록된 연차·반차 목록 ({leaveStats.list.length}건)
                  </span>
                  <span className="text-[11px] text-slate-500">달력에서 원하는 날짜를 클릭해 바로 지정 가능</span>
                </div>

                {leaveStats.list.length === 0 ? (
                  <div className="py-8 text-center rounded-xl bg-slate-50 border border-slate-200 text-slate-400">
                    {activeYear}년에 등록된 연차·반차 일정이 없습니다.
                    <br />
                    달력에서 날짜를 클릭해 연차·오전반차·오후반차를 지정해보세요!
                  </div>
                ) : (
                  <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                    {leaveStats.list.map((item) => {
                      const dObj = parseDateKey(item.dateKey);
                      const dow = DAYS_OF_WEEK[dObj.getDay()];
                      return (
                        <div
                          key={item.dateKey}
                          className="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-white border border-slate-200 hover:border-teal-300"
                        >
                          <div
                            onClick={() => {
                              setAnchorDate(dObj);
                              setIsLeaveSummaryModalOpen(false);
                              setModalDate(item.dateKey);
                            }}
                            className="flex items-center gap-2 min-w-0 flex-1 cursor-pointer"
                          >
                            <span className="font-extrabold text-slate-800 shrink-0">
                              {item.dateKey} ({dow})
                            </span>
                            <span
                              className={`px-2 py-0.5 rounded border text-[11px] font-extrabold shrink-0 ${item.meta.badgeClass}`}
                            >
                              {item.meta.emoji} {item.meta.shortLabel}
                            </span>
                            {item.memo && (
                              <span className="text-[11px] text-slate-500 break-words">{item.memo}</span>
                            )}
                          </div>

                          <button
                            type="button"
                            onClick={() => handleSetLeaveOnDate(item.dateKey, null)}
                            className="p-1 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50 shrink-0"
                            title="연차·반차 해제"
                          >
                            <Icon name="trash" className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>

            <div className="px-5 py-3 border-t border-slate-200 bg-slate-50 flex justify-end">
              <button
                type="button"
                onClick={() => setIsLeaveSummaryModalOpen(false)}
                className="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-extrabold shadow-xs"
              >
                확인
              </button>
            </div>
          </div>
        </div>
      )}

      {/* 토스트 알림 */}
      {toastMessage && (
        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[92vw] max-w-md bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-lg text-xs font-bold flex items-center gap-2 border border-slate-700">
          <span className="w-2 h-2 rounded-full bg-emerald-400 shrink-0" />
          <span className="leading-snug">{toastMessage}</span>
        </div>
      )}

      <style>{`
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(148, 163, 184, 0.5); border-radius: 9999px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(100, 116, 139, 0.8); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
